[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chz>=0.4.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "jinja2>=3.1.6",
    "matplotlib[dev]>=3.10.8",
    "openai>=2.16.0",
    "psycopg2-binary>=2.9.11",
    "python-dotenv>=1.2.1",
    "tinker>=0.9.0",
    "uvicorn>=0.34.0",
    "youtube-transcript-api>=1.2.4",
    "yt-dlp>=2026.1.29",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29.5"
]

[project.scripts]
fetch-video-metadata = "datasets.youtube_ai_dot_engineer.fetch_video_metadata:main"
generate-synthetic-feedback = "datasets.youtube_ai_dot_engineer.generate_synthetic_feedback:main"
tinker-checkpoints-rm = "utils.tinker_checkpoints_rm:main"
youtube-reviews-rlvr-train = "trains.rlvr_youtube_reviews.train:main"
youtube-reviews-sft-train = "trains.sft_youtube_reviews.train:main"
lab-server = "server.main:main"

[tool.hatch.build.targets.wheel]
packages = ["datasets", "server", "trains", "utils"]
