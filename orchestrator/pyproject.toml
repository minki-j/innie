[project]
name = "orchestrator"
version = "0.1.0"
description = "Prefect pipeline that scrapes YouTube videos and evaluates them against topic criteria using LLMs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.128.2",
    "httpx>=0.28.1",
    "langchain>=1.2.9",
    "langchain-anthropic>=1.3.1",
    "langchain-google-genai>=4.2.0",
    "langchain-openai>=1.1.7",
    "prefect>=3.6.16",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "uvicorn>=0.40.0",
    "youtube-transcript-api>=1.2.4",
    "yt-dlp>=2026.2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flows", "models", "scripts", "tasks"]

[project.scripts]
generate-models = "scripts.generate_models:main"
generate-diagrams = "scripts.generate_diagrams:main"
pipeline = "flows.video_pipeline:video_pipeline"
server = "server:app"
