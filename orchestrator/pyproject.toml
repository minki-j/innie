[project]
name = "orchestrator"
version = "0.1.0"
description = "Prefect pipeline that scrapes YouTube videos and evaluates them against topic criteria using LLMs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135.1",
    "graphviz>=0.21",
    "httpx>=0.28.1",
    "langchain>=1.2.12",
    "langchain-anthropic>=1.3.5",
    "langchain-google-genai>=4.2.1",
    "langchain-openai>=1.1.11",
    "langgraph-sdk>=0.3.11",
    "prefect>=3.6.22",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "redis>=7.3.0",
    "uvicorn>=0.41.0",
    "youtube-transcript-api>=1.2.4",
    "yt-dlp>=2026.3.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flows", "models", "scripts", "tasks"]

[project.scripts]
generate-models = "scripts.generate_models:main"
generate-diagrams = "scripts.generate_diagrams:main"
generate_flow_diagram = "scripts.flow_diagram:main"
pipeline = "flows.video_pipeline:video_pipeline"
server = "scripts.server:main"
sync-prefect = "scripts.sync_prefect:main"
serve-local = "scripts.serve_local:main"
deploy = "scripts.deploy:main"
