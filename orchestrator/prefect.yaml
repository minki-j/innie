name: orchestrator
prefect-version: 3.6.16

build: null
push: null

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: ./

deployments:
  - name: video-pipeline
    entrypoint: flows/video_pipeline.py:video_pipeline
    work_pool:
      name: main
    schedules:
      - cron: "0 * * * *"  # every hour; topics self-regulate via pipelineIntervalHours
        timezone: "UTC"